<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>120+ Python Projects Archive — Orlando Vivas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
        background: #f6f4ef;
        color: #141413;
        padding: 20px;
        line-height: 1.5;
      }
      .wrap { max-width: 960px; margin: 0 auto; }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(20, 20, 19, 0.16);
        margin-bottom: 18px;
      }
      h1 { font-family: "Space Grotesk", sans-serif; font-size: 1.55rem; letter-spacing: -0.02em; }
      .sub { font-size: 0.88rem; color: #5a5852; margin-top: 3px; }
      .count {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
        font-weight: 600;
        color: #d9480f;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 18px;
      }
      input[type="search"] {
        flex: 1;
        min-width: 220px;
        padding: 9px 13px;
        border-radius: 6px;
        border: 1px solid rgba(20, 20, 19, 0.24);
        background: #ffffff;
        font-family: inherit;
        font-size: 0.9rem;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
      .chip {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(20, 20, 19, 0.2);
        background: #ffffff;
        color: #4b4a45;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }
      .chip.active { background: #141413; color: #f6f4ef; border-color: #141413; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 10px;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(20, 20, 19, 0.12);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .cat {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.68rem;
        color: #d9480f;
        text-transform: uppercase;
        display: block;
        margin-bottom: 3px;
      }
      .name { font-weight: 600; font-size: 0.88rem; color: #141413; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Python Practice Archive (115+ Projects)</h1>
          <p class="sub">Searchable catalog of Python scripts, desktop GUIs, games, scrapers, vision &amp; automation labs.</p>
        </div>
        <span class="count" id="result-count"></span>
      </header>

      <div class="controls">
        <input type="search" id="search" placeholder="Search projects (e.g. QR, PDF, Snake, OCR, Encryption, Weather)..." aria-label="Search Python projects" />
      </div>

      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>

        { name: "Leap Year Checker", cat: "Security & Utils" },
        { name: "Random Word from List", cat: "Security & Utils" },
      ];

      const CATS = ["All", ...new Set(CATALOG.map((x) => x.cat))];
      let activeCat = "All";
      let query = "";

      const chipsEl = document.getElementById("chips");
      const gridEl = document.getElementById("grid");
      const countEl = document.getElementById("result-count");

      function renderChips() {
        chipsEl.innerHTML = CATS.map(
          (c) => `<button type="button" class="chip ${c === activeCat ? "active" : ""}" data-cat="${c}">${c}</button>`
        ).join("");
        chipsEl.querySelectorAll("[data-cat]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCat = btn.getAttribute("data-cat");
            renderChips();
            renderGrid();
          });
        });
      }

      function renderGrid() {
        const list = CATALOG.filter((item) => {
          const okCat = activeCat === "All" || item.cat === activeCat;
          const okQ = !query || item.name.toLowerCase().includes(query) || item.cat.toLowerCase().includes(query);
          return okCat && okQ;
        });
        countEl.textContent = `${list.length} of ${CATALOG.length} projects`;
        gridEl.innerHTML = list
          .map((it) => `<article class="card"><span class="cat">${it.cat}</span><div class="name">${it.name}</div></article>`)
          .join("");
      }

      document.getElementById("search").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        renderGrid();
      });

      renderChips();
      renderGrid();
    </script>
  </body>
</html>
