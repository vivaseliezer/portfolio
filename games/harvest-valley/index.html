<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harvest Valley Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  /* Layout: one phone-width game column on a sunflower frame; navy panels stacked like a handheld farm sim */
  --frame: #f3b51b;
  --frame-ink: #1d3f9a;
  --shell: #0b1427;
  --panel: #111d36;
  --panel-2: #182a4d;
  --line: #2b4271;
  --ink: #eef3ff;
  --muted: #9cafd3;
  --gold: #ffd24a;
  --good: #7fdc5a;
  --bad: #ff7b6b;
  --green: #4aa634; --green-d: #276b1b;
  --blue: #2f63c4; --blue-d: #1b3f86;
  --orange: #e2832a; --orange-d: #9c4c12;
  --purple: #3b2e80;
  --display: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    repeating-linear-gradient(135deg, transparent 0 22px, rgba(29,63,154,.9) 22px 30px) top right / 140px 140px no-repeat,
    radial-gradient(circle, rgba(29,63,154,.35) 2px, transparent 2.5px) 0 0 / 22px 22px,
    var(--frame);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 600;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
svg { display: block; }

.game {
  max-width: 620px; margin: 0 auto;
  background: var(--shell);
  border: 3px solid #070d1b;
  border-radius: 22px;
  padding: 12px;
  display: grid; gap: 10px;
  box-shadow: 0 14px 0 rgba(7,13,27,.35), 0 24px 50px rgba(7,13,27,.35);
}
.panel {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  min-width: 0;
}
.panel h2 {
  margin: 0; padding: 8px 12px;
  font: 400 1.05rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  text-align: center; border-bottom: 2px solid var(--line);
}

/* HUD */
.hud { display: grid; grid-template-columns: 1fr 1fr 1.2fr auto; align-items: center; gap: 0; padding: 8px 10px; }
.hud > div { padding: 2px 10px; min-width: 0; }
.hud > div + div { border-left: 2px solid var(--line); }
.hud .day { display: flex; align-items: center; gap: 8px; }
.hud .day svg { width: 38px; height: 38px; flex: none; }
.hud .big { font: 400 1.15rem/1.1 var(--display); letter-spacing: .03em; }
.hud .sub { color: var(--muted); font-size: .82rem; }
.hud .label { font: 400 .78rem/1 var(--display); letter-spacing: .1em; color: var(--muted); text-align: center; }
.money { text-align: center; }
.money .big { color: var(--gold); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.energy .bar { margin-top: 5px; height: 18px; border-radius: 99px; background: #0a1222; border: 2px solid #22375e; position: relative; overflow: hidden; }
.energy .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#8be36a, #3f9c2a); transition: width .3s; }
.energy .txt { position: relative; display: block; text-align: center; font-size: .75rem; line-height: 14px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
.gear { width: 42px; height: 42px; border-radius: 10px; background: var(--panel-2); border: 2px solid var(--line); display: grid; place-items: center; margin-left: 8px; }
.gear svg { width: 24px; height: 24px; }

/* Scene */
.scene { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); background: #6cae3c; }
.scene canvas { display: block; width: 100%; height: auto; aspect-ratio: 640 / 400; max-width: 100%; touch-action: manipulation; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  background: rgba(11,20,39,.92); border: 2px solid var(--gold); color: var(--ink);
  padding: 6px 14px; border-radius: 99px; font-size: .9rem; white-space: nowrap; max-width: 92%;
  overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}

/* Tables */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rows { padding: 4px 12px 8px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 1.02rem; }
.row + .row { border-top: 1px solid var(--line); }
.row svg { width: 24px; height: 24px; flex: none; }
.row .name { flex: 1; min-width: 0; }
.row .val { font: 400 1.15rem/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.row .price { color: var(--gold); }
.trend { font-size: .7rem; margin-left: 4px; }
.trend.up { color: var(--good); } .trend.down { color: var(--bad); }
.seedcount { display: block; font-size: .72rem; color: var(--muted); }

/* Actions */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.act {
  display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 10px; border-radius: 14px; border: 2px solid rgba(0,0,0,.35);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 4px 0 rgba(0,0,0,.35);
  transition: transform .08s, filter .15s; position: relative; min-width: 0;
}
.act:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.35); }
.act:hover { filter: brightness(1.08); }
.act svg { width: 40px; height: 40px; flex: none; }
.act b { font: 400 1.25rem/1 var(--display); letter-spacing: .04em; display: block; }
.act small { font-size: .74rem; line-height: 1.15; display: block; opacity: .9; }
.act.plant { background: linear-gradient(var(--green), var(--green-d)); }
.act.harvest { background: linear-gradient(var(--blue), var(--blue-d)); }
.act.sell { background: linear-gradient(var(--orange), var(--orange-d)); }
.act[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
.badge { position: absolute; top: -8px; right: -6px; background: var(--gold); color: #3a2a00; font: 400 .85rem/1 var(--display); padding: 4px 7px; border-radius: 99px; border: 2px solid #070d1b; }

/* Tray */
.tray { padding: 10px 12px; display: grid; gap: 8px; }
.tray .hint { color: var(--muted); font-size: .85rem; margin: 0; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--panel-2); border: 2px solid var(--line); text-align: left; min-width: 0; }
.chip svg { width: 26px; height: 26px; flex: none; }
.chip.on { border-color: var(--gold); background: #2a3a20; }
.chip span { min-width: 0; }
.chip small { display: block; color: var(--muted); font-size: .74rem; }
.sellrow { display: grid; grid-template-columns: 26px 1fr auto auto; align-items: center; gap: 8px; }
.sellrow svg { width: 24px; height: 24px; }
.sellrow .meta small { display: block; color: var(--muted); font-size: .74rem; }
.btn {
  padding: 7px 12px; border-radius: 9px; font: 400 .95rem/1 var(--display); letter-spacing: .04em;
  background: linear-gradient(#6ccf4a, #2f8a1f); border: 2px solid rgba(0,0,0,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 rgba(0,0,0,.35);
}
.btn:disabled { filter: grayscale(.9) brightness(.7); cursor: not-allowed; }
.btn.alt { background: linear-gradient(#e9953b, #a8561a); }
.btn.ghost { background: var(--panel-2); }
.btn.danger { background: linear-gradient(#e2574c, #9b2b22); }
.settings ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .88rem; line-height: 1.45; }
.settings .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Shop + tasks */
.lower { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.shop { background: linear-gradient(var(--purple), var(--panel) 60%); }
.shop h2 { border-color: #5a4bb0; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
.item { background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px; padding: 8px 6px; display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.item .t { font-size: .82rem; }
.item svg { width: 44px; height: 30px; }
.item .p { font: 400 1.1rem/1 var(--display); color: var(--gold); }
.item .p small { font: 600 .68rem var(--body); color: var(--muted); }
.item .btn { width: 100%; padding: 6px 4px; font-size: .85rem; }
.task { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 8px; align-items: center; padding: 7px 0; }
.task + .task { border-top: 1px solid var(--line); }
.task svg { width: 20px; height: 20px; }
.task .n { font-size: .9rem; min-width: 0; }
.task .c { font: 400 .95rem/1 var(--display); font-variant-numeric: tabular-nums; }
.task.done .c { color: var(--good); }
.task .track { grid-column: 2 / 4; height: 6px; border-radius: 9px; background: #0a1222; overflow: hidden; }
.task .track i { display: block; height: 100%; background: var(--good); }
.task .btn { grid-column: 2 / 4; justify-self: start; padding: 5px 10px; font-size: .82rem; }
.task .reward { color: var(--muted); font-size: .72rem; }

/* Console */
.console { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; padding: 0 12px 12px; }
.console h2 { grid-column: 1 / -1; margin: 0 -12px; }
.log { font-family: var(--mono); font-size: .8rem; line-height: 1.55; height: 7.8em; overflow-y: auto; min-width: 0; padding-top: 8px; }
.log p { margin: 0; }
.log .plant { color: #cfe0ff; } .log .harvest { color: #9fd0ff; } .log .sell { color: var(--good); }
.log .gold { color: var(--gold); } .log .info { color: var(--muted); } .log .warn { color: var(--bad); }
.next { padding: 12px 16px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.next svg { width: 16px; height: 16px; }

@media (max-width: 560px) {
  .game { padding: 8px; border-radius: 16px; }
  .hud { grid-template-columns: 1fr 1fr auto; row-gap: 8px; }
  .hud .energy { grid-column: 1 / 3; grid-row: 2; border-left: 0 !important; }
  .hud .gear { grid-row: 1; grid-column: 3; }
  .two, .lower { grid-template-columns: 1fr; }
  .act { flex-direction: column; text-align: center; gap: 4px; padding: 8px 4px; }
  .act small { display: none; }
  .chips { grid-template-columns: 1fr; }
  .console { grid-template-columns: 1fr; }
  .next { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .energy .fill, .act { transition: none; } }
</style>

<main class="game" id="game">
  <header class="panel hud">
    <div class="day"><span id="wxIcon"></span><div><div class="big" id="dayLbl">DAY 1</div><div class="sub" id="wxLbl">Sunny</div></div></div>
    <div class="money"><div class="label">MONEY</div><div class="big" id="moneyLbl">$1,500</div></div>
    <div class="energy"><div class="label">ENERGY</div><div class="bar"><span class="fill" id="enFill"></span><span class="txt" id="enLbl">100 / 100</span></div></div>
    <button class="gear" id="gearBtn" data-act="settings" aria-label="Settings and help">
      <svg viewBox="0 0 24 24"><path fill="#d8e2f7" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <section class="scene">
    <canvas id="farm" aria-label="Your farm. Tap a field plot to plant or harvest."></canvas>
    <div class="toast" id="toast" hidden></div>
  </section>

  <div class="two">
    <section class="panel"><h2>Market Prices</h2><div class="rows" id="market"></div></section>
    <section class="panel"><h2>Inventory</h2><div class="rows" id="inventory"></div></section>
  </div>

  <div class="actions">
    <button class="act plant" data-act="mode" data-mode="plant" id="btnPlant">
      <svg viewBox="0 0 48 48"><ellipse cx="24" cy="40" rx="15" ry="5" fill="#6b3d1e"/><path d="M24 40V22" stroke="#9be36f" stroke-width="3.5" stroke-linecap="round"/><path d="M24 26c-2-7-8-10-14-9 1 6 7 10 14 9z" fill="#7fd14f"/><path d="M24 22c2-7 8-10 14-9-1 6-7 10-14 9z" fill="#a8eb6c"/></svg>
      <span><b>PLANT</b><small>Plant seeds in your field</small></span>
    </button>
    <button class="act harvest" data-act="harvestAll" id="btnHarvest">
      <svg viewBox="0 0 48 48"><path d="M30 6c10 4 13 16 7 24-2-9-9-15-19-15 3-6 7-9 12-9z" fill="#dfe6f2"/><path d="M30 6c6 4 8 11 6 18" stroke="#9aa6bb" stroke-width="2" fill="none"/><path d="M18 15l-9 27" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/></svg>
      <span><b>HARVEST</b><small>Gather every ripe plot</small></span>
    </button>
    <button class="act sell" data-act="mode" data-mode="sell" id="btnSell">
      <svg viewBox="0 0 48 48"><path d="M6 22h30l-3 20H9z" fill="#b8742f"/><path d="M8 28h26M8 35h25" stroke="#7d4a19" stroke-width="2"/><circle cx="14" cy="18" r="6" fill="#f07f23"/><circle cx="25" cy="16" r="7" fill="#e74b3c"/><path d="M19 10c2-3 5-4 8-3" stroke="#4aa634" stroke-width="2.5" fill="none"/><circle cx="38" cy="36" r="8" fill="#ffd24a" stroke="#b8860b" stroke-width="2"/><text x="38" y="40.5" font-size="11" text-anchor="middle" fill="#8a6100" font-family="Arial" font-weight="bold">$</text></svg>
      <span><b>SELL</b><small>Sell crops at the market</small></span>
    </button>
  </div>

  <section class="panel tray" id="tray" hidden></section>

  <div class="lower">
    <section class="panel shop"><h2>Seed Shop</h2><div class="items" id="shop"></div></section>
    <section class="panel"><h2>Tasks</h2><div class="rows" id="tasks"></div></section>
  </div>

  <section class="panel console">
    <h2>Console</h2>
    <div class="log" id="log" aria-live="polite"></div>
    <button class="btn next" data-act="nextDay">NEXT DAY <svg viewBox="0 0 16 16"><path d="M4 2l9 6-9 6z" fill="currentColor"/></svg></button>
  </section>
</main>

<script>
const CROPS = {
  Wheat:  { seed: 10, base: 25, days: 2 },
  Corn:   { seed: 15, base: 30, days: 3 },
  Carrot: { seed: 20, base: 35, days: 4 },
};
const NAMES = Object.keys(CROPS);
const PLOTS = 8, PER_PLOT = 10, MAX_ENERGY = 100, PACK = 10;
const COST = { plant: 5, harvest: 4 };
const WEATHER = {
  Sunny:  { weight: 5, growth: 1, note: 'Sunny: harvests today yield +20%.' },
  Cloudy: { weight: 3, growth: 1, note: 'Cloudy: a calm day on the farm.' },
  Rainy:  { weight: 2, growth: 2, note: 'Rainy: crops grow twice as fast tonight.' },
};
const SAVE_KEY = 'harvest-valley-v1';

const ICON = {
  Wheat: `<svg viewBox="0 0 24 24"><path d="M12 23V7" stroke="#b98a24" stroke-width="1.6"/><g fill="#f1c24a">${[6,10,14].map(y=>`<ellipse cx="9.4" cy="${y}" rx="1.8" ry="3" transform="rotate(-30 9.4 ${y})"/><ellipse cx="14.6" cy="${y}" rx="1.8" ry="3" transform="rotate(30 14.6 ${y})"/>`).join('')}<ellipse cx="12" cy="3.5" rx="1.6" ry="2.8"/></g></svg>`,
  Corn: `<svg viewBox="0 0 24 24"><path d="M12 22c-6-2-8-8-7-14 3 3 5 7 7 14z" fill="#5fb43a"/><ellipse cx="13" cy="10.5" rx="4" ry="8.5" fill="#f6d33f" transform="rotate(12 13 10.5)"/><path d="M12 22c5-2 8-7 8-13-3 3-6 7-8 13z" fill="#7fd14f"/><g fill="#d9a91f">${[5,8,11,14].map(y=>`<circle cx="12.4" cy="${y}" r=".8"/><circle cx="14.6" cy="${y+1}" r=".8"/>`).join('')}</g></svg>`,
  Carrot: `<svg viewBox="0 0 24 24"><path d="M12 6l-3 2-2 5 4-1z M12 6l3 2 2 5-4-1z" fill="#56b03a"/><path d="M11 3c0 3 .3 5 1 7 .7-2 1-4 1-7z" fill="#7fd14f"/><path d="M7.5 10.5c3-1.4 6-1.4 9 0L12.6 22.5a.7.7 0 0 1-1.2 0z" fill="#f07f23"/><path d="M9.5 13.5h2.5M10.5 16.5h2.5M11 19h1.6" stroke="#b9561a" stroke-width=".9"/></svg>`,
};
const SEED_ICON = c => {
  const col = { Wheat: '#e2b046', Corn: '#f2cf3c', Carrot: '#ef8a3a' }[c];
  return `<svg viewBox="0 0 44 30"><g fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width="1"><ellipse cx="13" cy="19" rx="7" ry="5" transform="rotate(-20 13 19)"/><ellipse cx="29" cy="20" rx="7" ry="5" transform="rotate(15 29 20)"/><ellipse cx="21" cy="11" rx="7" ry="5" transform="rotate(-5 21 11)"/></g></svg>`;
};
const WX_ICON = {
  Sunny: `<svg viewBox="0 0 40 40"><g stroke="#ffcc33" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="20" y1="3" x2="20" y2="8" transform="rotate(${a} 20 20)"/>`).join('')}</g><circle cx="20" cy="20" r="8.5" fill="#ffd84a"/></svg>`,
  Cloudy: `<svg viewBox="0 0 40 40"><circle cx="27" cy="13" r="6" fill="#ffd84a"/><path d="M10 31a7 7 0 0 1 1-14 9 9 0 0 1 17 2 6 6 0 0 1 1 12z" fill="#dfe6f2"/></svg>`,
  Rainy: `<svg viewBox="0 0 40 40"><path d="M10 25a7 7 0 0 1 1-14 9 9 0 0 1 17 2 6 6 0 0 1 1 12z" fill="#aab6cc"/><g stroke="#6fb4ff" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="29" x2="11" y2="35"/><line x1="20" y1="29" x2="18" y2="35"/><line x1="27" y1="29" x2="25" y2="35"/></g></svg>`,
};
const TASK_ICON = { plant: '#7fd14f', harvest: '#6fb4ff', sell: '#ffd24a' };

const $ = s => document.querySelector(s);
const el = {
  wxIcon: $('#wxIcon'), dayLbl: $('#dayLbl'), wxLbl: $('#wxLbl'), money: $('#moneyLbl'),
  enFill: $('#enFill'), enLbl: $('#enLbl'), market: $('#market'), inv: $('#inventory'),
  tray: $('#tray'), shop: $('#shop'), tasks: $('#tasks'), log: $('#log'), toast: $('#toast'),
  btnHarvest: $('#btnHarvest'), btnPlant: $('#btnPlant'), btnSell: $('#btnSell'),
};
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

let state;
let ui = { mode: 'plant', confirmReset: false };

function makeTask(type, crop, goal) {
  const reward = Math.round(goal * CROPS[crop].base * (type === 'sell' ? 0.3 : 0.45) / 10) * 10;
  return { type, crop, goal, progress: 0, reward };
}
function randomTask() {
  for (let i = 0; i < 20; i++) {
    const type = pick(['plant', 'harvest', 'sell']), crop = pick(NAMES);
    if (state.tasks.some(t => t.type === type && t.crop === crop)) continue;
    const goal = pick([20, 30, 40, 50, 60]) + Math.min(60, Math.floor(state.day / 5) * 10);
    return makeTask(type, crop, goal);
  }
  return makeTask('sell', 'Wheat', 40);
}
function newState() {
  return {
    day: 1, weather: 'Sunny', money: 1500, energy: MAX_ENERGY,
    seeds: { Wheat: 20, Corn: 0, Carrot: 0 },
    inv: { Wheat: 0, Corn: 0, Carrot: 0 },
    plots: Array(PLOTS).fill(null),
    prices: { Wheat: 25, Corn: 30, Carrot: 35 },
    prev: { Wheat: 25, Corn: 30, Carrot: 35 },
    plantCrop: 'Wheat',
    tasks: [makeTask('plant', 'Wheat', 50), makeTask('harvest', 'Corn', 30), makeTask('sell', 'Carrot', 20)],
    log: [
      { t: 'Welcome to Harvest Valley! You start with 20 Wheat seeds.', k: 'info' },
      { t: 'Tap an empty plot in the field to plant.', k: 'info' },
    ],
  };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.plots && s.plots.length === PLOTS) return s;
  } catch (e) {}
  return null;
}

/* ---------- game actions ---------- */
function log(t, k = 'info') { state.log.push({ t, k }); if (state.log.length > 40) state.log.shift(); }
let toastTimer;
function toast(msg) {
  el.toast.textContent = msg; el.toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.hidden = true, 2000);
}
function spend(n) {
  if (state.energy < n) { toast('Too tired! Press Next Day to rest.'); return false; }
  state.energy -= n; return true;
}
function progress(type, crop, n) {

function plantAt(i) {
  const crop = state.plantCrop, have = state.seeds[crop];

  if (!spend(COST.plant)) return;
  const qty = Math.min(PER_PLOT, have);
  state.seeds[crop] -= qty;
  state.plots[i] = { crop, qty, age: 0 };

}
function harvestAt(i, quiet) {

  if (!spend(COST.harvest)) return -1;
  const n = p.qty + (state.weather === 'Sunny' ? Math.ceil(p.qty * 0.2) : 0);
  state.inv[p.crop] += n;
  state.plots[i] = null;
  progress('harvest', p.crop, n);

}

  const got = {};

    const p = state.plots[i];
    if (!isReady(p)) continue;
    any = true;
    const crop = p.crop, n = harvestAt(i, true);
    if (n < 0) break;
    got[crop] = (got[crop] || 0) + n;

}
function sell(crop, qty) {

  const amt = q * state.prices[crop];

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, crop = b.dataset.crop;
  if (a === 'mode') { ui.mode = ui.mode === b.dataset.mode ? null : b.dataset.mode; render(); }
  else if (a === 'settings') { ui.mode = ui.mode === 'settings' ? null : 'settings'; ui.confirmReset = false; render(); }
