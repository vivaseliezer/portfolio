<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Snake — Playable Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1120;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        user-select: none;
      }
      .hud {
        width: 100%;
        max-width: 340px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        background: #131e35;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        padding: 7px 14px;
      }
      .stat-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #94a3b8;
      }
      .stat-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: #38bdf8;
      }
      .stat-value.best {
        color: #34d399;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 340px;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 16px 36px rgba(2, 6, 23, 0.6);
        background: #070c18;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 17, 32, 0.84);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        gap: 12px;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay h2 {
        font-size: 1.5rem;
        color: #f8fafc;
      }
      .overlay p {
        font-size: 0.9rem;
        color: #94a3b8;
        max-width: 280px;
      }
      .btn {
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .controls {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .hint {
        font-size: 0.76rem;
        color: #94a3b8;
      }
      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 42px);
        grid-template-rows: repeat(2, 36px);
        gap: 5px;
      }
      .dpad button {
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: #131e35;
        color: #f1f5f9;
        font-size: 1.05rem;
        cursor: pointer;
      }
      .dpad button:active {
        background: #38bdf8;
        color: #0b1120;
      }
      .up { grid-column: 2; grid-row: 1; }
      .left { grid-column: 1; grid-row: 2; }
      .down { grid-column: 2; grid-row: 2; }
      .right { grid-column: 3; grid-row: 2; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div>
        <div class="stat-label">Speed</div>
        <div class="stat-value" id="speed">1x</div>
      </div>
      <div>
        <div class="stat-label">Best</div>
        <div class="stat-value best" id="best">0</div>
      </div>
    </div>

    <div class="stage">
      <canvas id="board" width="420" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Neon Snake</h2>
        <p id="overlay-msg">Use Arrow Keys, WASD, or the buttons below to collect energy nodes.</p>
        <button class="btn" id="start-btn">Play Now</button>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" aria-label="Touch directional controls">
        <button type="button" class="up" data-dir="up" aria-label="Up">&#9650;</button>
        <button type="button" class="left" data-dir="left" aria-label="Left">&#9664;</button>
        <button type="button" class="down" data-dir="down" aria-label="Down">&#9660;</button>
        <button type="button" class="right" data-dir="right" aria-label="Right">&#9654;</button>
      </div>
      <span class="hint">Keys: Arrows / WASD &bull; Space: Pause</span>
    </div>

    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const speedEl = document.getElementById("speed");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMsg = document.getElementById("overlay-msg");
      const startBtn = document.getElementById("start-btn");

      const GRID = 21;
      const CELL = canvas.width / GRID;
      let snake, dir, nextDir, food, score, best, loopId, tickMs, running, paused;

      best = Number(localStorage.getItem("orlando-snake-best") || 0);
      bestEl.textContent = best;

      function randomFood() {
        let pos;
        do {
          pos = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID),
          };
        } while (snake.some((s) => s.x === pos.x && s.y === pos.y));
        return pos;
      }

      function initGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        tickMs = 135;
        running = true;
        paused = false;
        food = randomFood();
        scoreEl.textContent = "0";
        speedEl.textContent = "1.0x";
        overlay.classList.add("hidden");
        clearTimeout(loopId);
        step();
      }

      function setDirection(name) {
        if (!running) return;
        const map = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const candidate = map[name];
        if (!candidate) return;
        if (candidate.x + dir.x === 0 && candidate.y + dir.y === 0) return;
        nextDir = candidate;
      }

      function step() {
        if (!running) return;
        if (paused) {
          loopId = setTimeout(step, 120);
          return;
        }

        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
        const hitSelf = snake.some((seg) => seg.x === head.x && seg.y === head.y);

        if (hitWall || hitSelf) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem("orlando-snake-best", String(best));
          }
          tickMs = Math.max(68, 135 - Math.floor(score / 20) * 6);
          speedEl.textContent = (135 / tickMs).toFixed(1) + "x";
          food = randomFood();
        } else {
          snake.pop();
        }

        draw();
        loopId = setTimeout(step, tickMs);
      }

      function draw() {
        ctx.fillStyle = "#070c18";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle grid
        ctx.strokeStyle = "rgba(148, 163, 184, 0.06)";
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        // Food glow
        ctx.fillStyle = "#34d399";
        ctx.shadowColor = "#10b981";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Snake segments
        snake.forEach((seg, idx) => {
          const isHead = idx === 0;
          ctx.fillStyle = isHead ? "#38bdf8" : idx % 2 === 0 ? "#6366f1" : "#4f46e5";
          const pad = isHead ? 1.5 : 2.5;
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
          ctx.fill();
        });
      }

      function gameOver() {
        running = false;
        clearTimeout(loopId);
        overlayTitle.textContent = "Game Over";
        overlayMsg.textContent = `Final Score: ${score} • Best: ${best}`;
        startBtn.textContent = "Play Again";
        overlay.classList.remove("hidden");
      }

      window.addEventListener("keydown", (e) => {
        const keyMap = {
          ArrowUp: "up",
          w: "up",
          W: "up",
          ArrowDown: "down",
          s: "down",
          S: "down",
          ArrowLeft: "left",
          a: "left",
          A: "left",
          ArrowRight: "right",
          d: "right",
          D: "right",
        };
        if (keyMap[e.key]) {
          e.preventDefault();
          setDirection(keyMap[e.key]);
        } else if (e.code === "Space" && running) {
          e.preventDefault();
          paused = !paused;
        }
      });

      document.querySelectorAll("[data-dir]").forEach((btn) => {
        btn.addEventListener("click", () => setDirection(btn.getAttribute("data-dir")));
      });

      startBtn.addEventListener("click", initGame);

      // Initial idle draw
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      food = { x: 15, y: 10 };
      draw();
    </script>
  </body>
</html>
